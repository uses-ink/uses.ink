# Dependency gates: licences we can ship under AGPL-3.0-or-later and MIT OR Apache-2.0,
# advisories, and where crates come from. Run by `cargo deny check` in CI.

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # `paste` is unmaintained, not unsound: a proc macro rav1e 0.8.1 (the latest) runs at build
    # time, so none of its code ships. Drop this when rav1e moves to `pastey`. cargo-deny cannot
    # scope an ignore to a crate, so this one silences `paste` for every dependent: `cargo tree -i
    # paste --workspace --all-features` must list `rav1e` alone (checked 2026-11-27, Cargo.lock),
    # and any other dependent is a new decision.
    { id = "RUSTSEC-2024-0436", reason = "build-time macro of rav1e, no maintained rav1e without it" },
]

[licenses]
# Apache-2.0 WITH LLVM-exception: wasmtime, Cranelift and the wasm tools (decision 0035)
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0", "AGPL-3.0-or-later"]
confidence-threshold = 0.93
# Permissive licences allowed only for the crate that needs them, so a new one is a decision.
exceptions = [
    { crate = "comrak", allow = ["BSD-2-Clause"] },
    { crate = "encoding_rs", allow = ["BSD-3-Clause"] },
    { crate = "finl_unicode", allow = ["Unicode-DFS-2016"] },
    # gix's hash tables and its pure-Rust zlib, for the git source (0036), and hashbrown's
    # hasher under wasmtime's and wit-bindgen's wasm parsers
    { crate = "foldhash", allow = ["Zlib"] },
    { crate = "zlib-rs", allow = ["Zlib"] },
    # axum's router, for `ink preview`
    { crate = "matchit", allow = ["BSD-3-Clause"] },
    # the constant-time comparisons under the sealer's XChaCha20-Poly1305 (secret/local)
    { crate = "subtle", allow = ["BSD-3-Clause"] },
    # Ed25519 for the signed-request profile (0068, `sig`), and the curve under it
    { crate = "curve25519-dalek", allow = ["BSD-3-Clause"] },
    { crate = "ed25519-dalek", allow = ["BSD-3-Clause"] },
    # AVIF, through rav1e (host/image)
    { crate = "av1-grain", allow = ["BSD-2-Clause"] },
    { crate = "avif-serialize", allow = ["BSD-3-Clause"] },
    { crate = "rav1e", allow = ["BSD-2-Clause"] },
    { crate = "ravif", allow = ["BSD-3-Clause"] },
    { crate = "v_frame", allow = ["BSD-2-Clause"] },
    # rav1e's `fuzzing` feature, which nothing enables; `all-features` above reaches it
    { crate = "libfuzzer-sys", allow = ["NCSA"] },
    # TLS for the SMTP adapter (mail/smtp, decision 0066) and for git over https (decision 0072): rustls over `ring`, with the bundled web
    # PKI roots. ISC is the licence of `ring`'s and webpki's own code; CDLA-Permissive-2.0 covers
    # the root certificates' data.
    { crate = "quoted_printable", allow = ["0BSD"] },
    { crate = "ring", allow = ["ISC"] },
    { crate = "rustls-webpki", allow = ["ISC"] },
    { crate = "untrusted", allow = ["ISC"] },
    { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
    # git over https (decision 0072) reuses that stack: gix's reqwest backend is built with the
    # `rustls-no-provider` feature, which also compiles `rustls-platform-verifier`, and that takes
    # the same roots as data in `webpki-root-certs`. Nothing calls it: the client is configured
    # with `webpki-roots` and `ring` in the `https` crate, so this is the one more crate that
    # carries the CDLA-Permissive-2.0 of the root certificates, and no second TLS stack
    { crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] },
    # Passkeys (0068, slice 2): webauthn-rs-core is MPL-2.0, a file-level copyleft that binds only
    # changes to its own files, and we change none (pinned `=0.6.2`, linked unmodified). Scoped to
    # the four crates of its tree that carry it, so a fifth MPL crate is a decision
    { crate = "webauthn-rs-core", allow = ["MPL-2.0"] },
    { crate = "webauthn-rs-proto", allow = ["MPL-2.0"] },
    { crate = "webauthn-attestation-ca", allow = ["MPL-2.0"] },
    { crate = "crypto-glue", allow = ["MPL-2.0"] },
    # JPEG copies (host/image): the IJG notice covers its port of libjpeg's tables
    { crate = "jpeg-encoder", allow = ["IJG"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
