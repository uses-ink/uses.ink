# The little guy: a stick figure holding a yellow pencil with a pink eraser. `cargo xtask brand`
# draws each drawing into `brand/<name>.svg` with the freehand pen; `open` names a second file
# drawn without the parts marked `head` (no head outline, for large sizes).
#
# Coordinates are pixels of the drawing. Named polygons are placed by each drawing's `place`
# (scaled, then moved), so the pencil is written once.

[polygon]
pencil-body = [[60, 44], [86, 14], [96, 23], [70, 54]]
pencil-eraser = [[86, 14], [92, 7], [102, 16], [96, 23]]
pencil-tip = [[60, 44], [52, 62], [70, 54]]

# The landing picture's shapes, corner to corner (a closed shape repeats its first corner).
scene-pile = [[44, 318], [118, 312], [124, 400], [50, 405], [44, 318]]
scene-sheet = [[76, 290], [150, 288], [152, 374], [130, 375]]
scene-tray = [[28, 362], [30, 448], [104, 450], [106, 410]]
scene-held = [[262, 176], [300, 174], [302, 212], [264, 214], [262, 176]]
scene-arrow = [[376, 106], [394, 121], [374, 132]]
scene-window = [[330, 168], [540, 164], [544, 404], [332, 408], [330, 168]]
scene-gold = [[530, 126], [534, 136], [544, 140], [534, 144], [530, 154], [526, 144], [516, 140], [526, 136], [530, 126]]
scene-low = [[316, 422], [320, 432], [330, 436], [320, 440], [316, 450], [312, 440], [302, 436], [312, 432], [316, 422]]
scene-far = [[556, 416], [560, 426], [570, 430], [560, 434], [556, 444], [552, 434], [542, 430], [552, 426], [556, 416]]

