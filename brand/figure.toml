# The marks of the reader theme (decision 0180): rules, underlines, a highlight, bullets, a circle
# for a margin note, a frame of four crossing strokes and a strip of tape. They are drawn once here
# and shipped as the theme's files; a page carries no script. A mark that is laid along a line or
# round a box stretches (`stretch`), so the stroke stays one width only where the box is as long as
# the mark: the frame is cut into nine parts by the stylesheet for that reason.
[[drawing]]
name = "rule"
folder = "crates/runtime/plugin/theme/quiet/assets/marks"
stretch = true
size = [800, 12]
hand = { wobble = 0.6, tremor = 0.5 }
shift = [0, 0]
place = { offset = [0, 0], scale = 1 }
stroke = [{ line = { segment = { from = [5, 5], to = [795, 5] } }, weight = 3.2 }]

