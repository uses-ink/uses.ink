    { line = { quad = { from = [230, 256], control = [206, 278], to = [186, 310] } }, weight = 3 },
    { line = { quad = { from = [231, 254], control = [254, 240], to = [270, 214] } }, weight = 3 },
    { line = { segment = { from = [225, 332], to = [206, 416] } }, weight = 3 },
    { line = { segment = { from = [227, 330], to = [252, 412] } }, weight = 3 },
    { line = { chain = "scene-held" }, weight = 3 },
    # the arrow it takes
    { line = { quad = { from = [300, 150], control = [340, 104], to = [392, 120] } }, weight = 3 },
    { line = { chain = "scene-arrow" }, weight = 3 },
    # the blog at your address
    { line = { chain = "scene-window" }, weight = 3 },
    { line = { segment = { from = [331, 196], to = [541, 192] } }, weight = 3 },
    { line = { points = [[344, 182], [345, 182]] }, weight = 4 },
    { line = { points = [[356, 181], [357, 181]] }, weight = 4 },
    { line = { segment = { from = [350, 232], to = [490, 232] } }, weight = 5 },
    { line = { segment = { from = [350, 262], to = [520, 262] } }, weight = 2.4 },
    { line = { segment = { from = [350, 280], to = [512, 280] } }, weight = 2.4 },
    { line = { segment = { from = [350, 298], to = [524, 298] } }, weight = 2.4 },
    { line = { segment = { from = [350, 316], to = [470, 316] } }, weight = 2.4 },
    { line = { segment = { from = [350, 348], to = [516, 348] } }, weight = 2.4 },
    { line = { segment = { from = [350, 366], to = [500, 366] } }, weight = 2.4 },
    # sparkles
    { line = { chain = "scene-gold" }, weight = 2.6 },
    { line = { chain = "scene-low" }, weight = 2.6 },
    { line = { chain = "scene-far" }, weight = 2.6 },
]
