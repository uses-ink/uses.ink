[workspace]
resolver = "3"
members = ["cli", "clock", "edge/api", "edge/control", "watch", "watch/git", "config", "diag", "edge", "edge/axum", "edge/folder", "engine", "fixture", "freehand", "freehand-web", "host/image", "host/native", "model", "plugin/format/markdown", "plugin/theme/quiet", "token", "trace", "tools/farm", "xtask", "host/wasmtime", "host/wasmtime/hostile", "plugin/sdk", "plugin/format/markdown/guest", "plugin/format/obsidian", "plugin/format/obsidian/guest", "plugin/theme/quiet/guest", "plugin/source/git", "plugin/source/git/guest", "blob", "blob/conformance", "blob/dir", "build", "build/conformance", "build/local", "control", "db", "db/conformance", "db/sqlite", "secret", "secret/conformance", "secret/local", "queue", "queue/conformance", "queue/local", "web", "mail", "mail/smtp", "https"]
exclude = ["spikes"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/uses-ink/uses.ink"
rust-version = "1.100"
publish = false

# Every crate of ours by its short name, so code says `token::Colour`.
[workspace.dependencies]
blob = { package = "uses-ink-blob", path = "blob" }
blob-conformance = { package = "uses-ink-blob-conformance", path = "blob/conformance" }
blob-dir = { package = "uses-ink-blob-dir", path = "blob/dir" }
build = { package = "uses-ink-build", path = "build" }
build-conformance = { package = "uses-ink-build-conformance", path = "build/conformance" }
build-local = { package = "uses-ink-build-local", path = "build/local" }
clock = { package = "uses-ink-clock", path = "clock" }
config = { package = "uses-ink-config", path = "config" }
control = { package = "uses-ink-control", path = "control" }
# test-only: a dev-dependency of any crate, a normal dependency of none
fixture = { package = "uses-ink-fixture", path = "fixture" }
db = { package = "uses-ink-db", path = "db" }
db-conformance = { package = "uses-ink-db-conformance", path = "db/conformance" }
db-sqlite = { package = "uses-ink-db-sqlite", path = "db/sqlite" }
diag = { package = "uses-ink-diag", path = "diag" }
edge = { package = "uses-ink-edge", path = "edge" }
edge-api = { package = "uses-ink-edge-api", path = "edge/api" }
edge-control = { package = "uses-ink-edge-control", path = "edge/control" }
edge-axum = { package = "uses-ink-edge-axum", path = "edge/axum" }
edge-folder = { package = "uses-ink-edge-folder", path = "edge/folder" }
engine = { package = "uses-ink-engine", path = "engine" }
format-markdown = { package = "uses-ink-format-markdown", path = "plugin/format/markdown" }
format-obsidian = { package = "uses-ink-format-obsidian", path = "plugin/format/obsidian" }
freehand = { path = "freehand" }
https = { package = "uses-ink-https", path = "https" }
host-image = { package = "uses-ink-host-image", path = "host/image" }
host-native = { package = "uses-ink-host-native", path = "host/native" }
host-wasmtime = { package = "uses-ink-host-wasmtime", path = "host/wasmtime" }
model = { package = "uses-ink-model", path = "model" }
secret = { package = "uses-ink-secret", path = "secret" }
secret-conformance = { package = "uses-ink-secret-conformance", path = "secret/conformance" }
secret-local = { package = "uses-ink-secret-local", path = "secret/local" }
mail = { package = "uses-ink-mail", path = "mail" }
mail-smtp = { package = "uses-ink-mail-smtp", path = "mail/smtp" }
queue = { package = "uses-ink-queue", path = "queue" }
queue-conformance = { package = "uses-ink-queue-conformance", path = "queue/conformance" }
queue-local = { package = "uses-ink-queue-local", path = "queue/local" }
sdk = { package = "uses-ink-sdk", path = "plugin/sdk" }
source-git = { package = "uses-ink-source-git", path = "plugin/source/git" }
theme-quiet = { package = "uses-ink-theme-quiet", path = "plugin/theme/quiet" }
token = { package = "uses-ink-token", path = "token" }
# logging (decision 0065): crates take it with `default-features = false`; the CLI adds `layers`, tests `capture`
trace = { package = "uses-ink-trace", path = "trace", default-features = false }
watch = { package = "uses-ink-watch", path = "watch" }
watch-git = { package = "uses-ink-watch-git", path = "watch/git" }
annotate-snippets = "0.12.18"
# colour and width for the terminal layer of the `ink` command (cli/src/term); clap already pulls both
anstream = "1.0.0"
anstyle = "1.0.14"
terminal_size = "0.4.4"
unicode-width = "0.2.3"
# tree-sitter grammars, only the languages enabled here (decision 0039)
arborium = { version = "2.18.2", features = [
    "lang-bash", "lang-c", "lang-css", "lang-diff", "lang-go", "lang-html", "lang-javascript", "lang-json",
    "lang-markdown", "lang-python", "lang-rust", "lang-toml", "lang-typescript", "lang-yaml",
] }
# its table from tree-sitter capture names to theme slots
arborium-theme = { version = "2.18.2", default-features = false }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
blake3 = "1.8.7"
bytes = "1.12.2"
# the control plane's ports (decision 0045): SQLite with the C library bundled, XChaCha20-Poly1305
# for sealed credentials, zeroing for plaintext, a minimal executor for the conformance suites
chacha20poly1305 = "0.10.1"
# the 0.6 line chacha20poly1305 uses; `std` makes its `Error` a `std::error::Error`
rand_core = { version = "0.6.4", features = ["getrandom", "std"] }
clap = { version = "4.6.9", features = ["derive", "env"] }
# completion scripts and the manual, generated from the one command tree (decision 0061)
clap_complete = "4.6.11"
clap_complete_nushell = "4.6.1"
clap_mangen = "0.2.33"
http-body-util = "0.1.5"
# benchmarks only: a dev-dependency of any crate, a normal dependency of none
divan = "0.1.21"
comrak = { version = "1.2.0", default-features = false }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
# git sources: rev parse, rev walk, tree diff, threads; the clients that fetch (`git.fetch`, 0046)
# are the file transport, which runs the machine's `git upload-pack`, and https through reqwest
# with no TLS feature of its own: the one TLS stack is rustls over ring, configured in `https`
# (decision 0072)
gix = { version = "0.91.0", default-features = false, features = ["blocking-http-transport-reqwest", "blocking-network-client", "pack-cache-lru-dynamic", "parallel", "revision", "sha1"] }
# the connection loop `ink serve` runs under axum: header and read budgets are hyper's (0051)
hyper = { version = "1.13.0", default-features = false, features = ["client", "http1", "server"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["http1", "server", "server-graceful", "service", "tokio"] }
insta = { version = "1.49.0", features = ["glob"] }
jiff = { version = "1.0.3", default-features = false, features = ["std", "serde"] }
# the self-host mail adapter (decision 0066): SMTP over rustls with the bundled web PKI roots
lettre = { version = "0.11.24", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1", "tokio1-rustls-tls"] }
libm = "0.2.16"
# git over https (decision 0072): the blocking client gix's transport uses, with rustls and no
# provider of its own (the provider is ring, chosen in `https`), the bundled web PKI roots lettre uses
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0.12"
# test-only: the certificate authorities and servers of the https tests
rcgen = { version = "0.14.5", default-features = false, features = ["pem", "ring"] }
math-core = "0.9.0"
pollster = "0.4.0"
proptest = "1.12.0"
sea-query = { version = "1.0.2", default-features = false, features = ["derive", "backend-sqlite"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
tempfile = "3.27.0"
quick-xml = "0.42.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde-saphyr = { version = "2.2.0", default-features = false, features = ["deserialize"] }
# serving (edge): sockets, timers, the folder adapter's reads, the accept loop and Ctrl-C
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "rt", "signal", "sync", "time"] }
toml = "1.2.3"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
# the subscriber behind `trace`: the registry for span data and `filter::Targets` for the filter
# language; no `fmt`, `env-filter` or `ansi`, so no regex engine and no second formatter
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }
toml_edit = "0.25.21"
unspliced = "0.1.3"
web = { package = "uses-ink-web", path = "web" }
# plugins as components (decision 0035): the host, the guests' bindings, and wrapping a guest's
# core module into a component
wasmtime = { version = "51.0.0", default-features = false, features = [
    "component-model", "cranelift", "parallel-compilation", "runtime", "std",
] }
zeroize = "1.9.2"
wit-bindgen = { version = "0.63.0", default-features = false, features = ["macros", "realloc"] }
wit-component = { version = "0.263.0", default-features = false }
# wit-component's error type, named by xtask
anyhow = "1.0.105"
# repo tasks: generated Rust is built as tokens and printed
# images (host/image): decoders without C, a SIMD resizer, AVIF through rav1e without its
# assembly, JPEG without its runtime SIMD paths, dimensions from headers alone
fast_image_resize = "6.2.0"
image = { version = "0.25.10", default-features = false, features = ["gif", "png", "webp"] }
imagesize = "0.15.0"
jpeg-encoder = "0.7.1"
# the JPEG reader: the release candidate reads optimized sequential files, which `image`'s pinned
# release does not; take the stable release when there is one and cargo accepts it for `image`
zune-jpeg = "=0.5.16-rc3"
ravif = { version = "0.13.0", default-features = false }
heck = "0.5.0"
prettyplease = "0.3.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.10", features = ["full", "visit"] }

# Dependencies build optimized and without debug assertions, so tests stay fast; `"*"` matches
# no workspace member, so our crates keep debug assertions (docs/conventions.md, Tests).
[profile.dev.package."*"]
# 3, not 2: compiling a tree-sitter grammar's queries must fit a highlighting test's budget
opt-level = 3
debug-assertions = false

# The plugins as they ship: `cargo build --profile component --target wasm32-unknown-unknown`,
# small and without unwinding, as decision 0035 measured them.
[profile.component]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[workspace.lints.rust]
# `deny`, not `forbid`, so `freehand-web` can expect it for its wasm exports; `xtask check`
# allows unsafe code in no other file.
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_must_use = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# No panics in library code: typed errors instead.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
# Nothing is silent: output goes through typed events, not print.
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
# Hacks are explained.
allow_attributes_without_reason = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"



# The release build of `ink`: what dist (dist-workspace.toml) and the Dockerfile build.
[profile.dist]
inherits = "release"
lto = "thin"
