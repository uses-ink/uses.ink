message = "the plugin `{plugin}` ran past its {limit} units of fuel in one call"

[diagnostic."plugin.budget.time"]
severity = "error"
fault = "ours"
fields = { plugin = "text", limit = "count" }
message = "the plugin `{plugin}` ran past its {limit} ms in one call"

[diagnostic."plugin.budget.memory"]
severity = "error"
fault = "ours"
fields = { plugin = "text", limit = "bytes" }
message = "the plugin `{plugin}` asked for more than its {limit} of memory"

