# Every diagnostic and notice uses.ink can emit: its code, how bad it is, whose move it is, its
# typed fields and its English wording. `cargo xtask diag` turns this file into the `Problem` and
# `Announcement` enums (model/src/generated.rs) and their wording (diag/src/generated.rs);
# `cargo xtask check` fails when either is stale.
#
# A code is `noun.noun.reason`: three kebab-case words joined by `.`.
# severity: error | warning | note. fault: author | source | operator | ours.
# Field types: path, paths, route, text, count, bytes, span, decision (a decision code, `AnyCode`).
# message and fix are templates: `{field}` is a declared field, `{{` and `}}` are braces.
# Notices are not problems, so they have no severity and no fault.
# A field name means one thing in every entry that has it, so `[field]` documents each name once
# and the generated field carries that doc; a name without one, or a doc no entry uses, fails.

[field]
address = "The address used, as written."
anchor = "The anchor given to the heading."
at = "The byte offset where the file stops being UTF-8."
bound = "The latest the date can be."
candidates = "Every file it could mean, in path order."
count = "How many there are."
date = "The date, as written."
decision = "The decision code it is about."
element = "The element's name."
expected = "What the key takes, worded for a person."
file = "The file that also routes there."
files = "Every file involved, in path order."
given = "The name as the author wrote it."
header = "The header's name."
key = "The key, as written."
kind = "The kind, as written."
language = "The language, as written after the opening fence."
limit = "The most that is allowed."
name = "The name given instead."
other = "The key written before it that sets the same thing."
path = "The file."
reason = "Why, as the part that refused it says."
route = "The route."
segment = "The segment of the path, as written."
size = "How large it is."
target = "The file it points at."
tex = "The TeX, as written."
theme = "The theme's name."
value = "The value taken, in the decision code's words."
written = "The text, as written."

[diagnostic."config.syntax.invalid"]
severity = "error"
fault = "author"
fields = { reason = "text" }
message = "ink.toml does not parse: {reason}"
fix = "fix the TOML at the marked place; nothing else in ink.toml is read until it parses"

[diagnostic."config.key.unknown"]
severity = "error"
fault = "author"
fields = { key = "text" }
message = "`{key}` is not a key ink.toml has"
fix = "remove it, or compare it with what `ink explain --pin` prints"

[diagnostic."config.value.invalid"]
severity = "error"
fault = "author"
fields = { key = "text", expected = "text" }
message = "`{key}` takes {expected}"

[diagnostic."frontmatter.syntax.invalid"]
severity = "warning"
fault = "author"
fields = { reason = "text" }
message = "the frontmatter does not parse, so the page is built without it: {reason}"
fix = "fix the YAML between the `---` lines"

[diagnostic."frontmatter.value.invalid"]
severity = "warning"
fault = "author"
fields = { key = "text", expected = "text" }
message = "the frontmatter's `{key}` takes {expected}, so it is ignored"
fix = "change the value at the marked place, or remove the key"

[diagnostic."frontmatter.key.conflict"]
severity = "warning"
fault = "author"
fields = { key = "text", other = "text" }
message = "the frontmatter's `{key}` sets the same thing as `{other}` before it, so it is ignored"
fix = "keep one of the two keys"

[diagnostic."source.file.encoding"]
severity = "error"
fault = "author"
fields = { at = "count" }
message = "the file is not UTF-8 text (byte {at}), so it is read as empty"
fix = "save the file as UTF-8"

[diagnostic."link.target.missing"]
severity = "warning"
fault = "author"
fields = { written = "text" }
message = "`{written}` points at no file, so it is shown as plain text"

[diagnostic."link.target.ambiguous"]
severity = "error"
fault = "author"
fields = { written = "text", candidates = "paths" }
message = "`{written}` could be any of {candidates}"
fix = "write the path of the one you mean"

[diagnostic."link.target.unpublished"]
severity = "warning"
fault = "author"
fields = { written = "text", target = "path" }
message = "`{written}` points at {target}, which is not published, so it is shown as plain text"
fix = "publish {target}, or remove the link"

[diagnostic."page.route.collision"]
severity = "error"
fault = "author"
fields = { route = "route", files = "paths" }
message = "{files} all route to {route}"
fix = "pin a different `page.slug` on all but one"

[diagnostic."html.element.stripped"]
severity = "warning"
fault = "author"
fields = { element = "text" }
message = "`<{element}>` is not allowed in a page and was removed"

[diagnostic."page.nesting.deep"]
severity = "warning"
fault = "author"
fields = { limit = "count" }
message = "blocks or inlines nested more than {limit} deep keep only their text"
fix = "nest lists, quotes and emphasis less deeply"

[diagnostic."source.file.unreadable"]
severity = "error"
fault = "source"
fields = { path = "path", reason = "text" }
message = "{path} could not be read: {reason}"

[diagnostic."source.budget.files"]
severity = "error"
fault = "author"
fields = { count = "count", limit = "count" }
message = "the source holds {count} files; a site may hold {limit}"
fix = "exclude folders that are not part of the site in ink.toml"

[diagnostic."source.budget.file"]
severity = "error"
fault = "author"
fields = { path = "path", size = "bytes", limit = "bytes" }
message = "{path} is {size}; a file may be {limit}"

[diagnostic."theme.route.collision"]
severity = "error"
fault = "author"
fields = { route = "route", theme = "text", file = "path" }
message = "the theme `{theme}` serves {route}, which {file} also routes to"
fix = "pin a different `page.slug` on {file}"

[diagnostic."render.page.failed"]
severity = "error"
fault = "ours"
fields = { reason = "text" }
message = "the page could not be rendered: {reason}"

[diagnostic."link.target.asset"]
severity = "warning"
fault = "author"
fields = { written = "text", target = "path" }
message = "`{written}` points at {target}, a file that is not a page, so it is shown as plain text"
fix = "link to a page, or show {target} as an image"

[diagnostic."pin.target.unpublished"]
severity = "error"
fault = "author"
fields = { decision = "decision", path = "path" }
message = "`{decision}` names {path}, which is not a published page"
fix = "pin a published page, or publish {path}"

[diagnostic."route.segment.unnamed"]
severity = "warning"
fault = "author"
fields = { path = "path", segment = "text" }
message = "`{segment}` in {path} has no letter or digit, so the route leaves it out"
fix = "rename it, or pin `page.slug`"

[diagnostic."asset.media.unknown"]
severity = "warning"
fault = "author"
fields = { path = "path" }
message = "{path} is a kind of file uses.ink does not serve, so it is left out"

[diagnostic."theme.route.reserved"]
severity = "error"
fault = "author"
fields = { route = "route", theme = "text" }
message = "the theme `{theme}` serves {route}, which uses.ink serves itself"
fix = "choose another theme, or ask its author to move the file"

[diagnostic."theme.page.refused"]
severity = "error"
fault = "author"
fields = { theme = "text" }
message = "the theme `{theme}` could not render the page"
fix = "see the cause below; choose another theme if it persists"

[diagnostic."source.blob.missing"]
severity = "error"
fault = "ours"
fields = { path = "path" }
message = "{path} is in the snapshot, but its bytes are not in the blob store"
fix = "build again; report it if it persists"

[diagnostic."engine.decision.repeated"]
severity = "error"
fault = "ours"
fields = { decision = "decision" }
message = "`{decision}` was decided twice"
fix = "report it: this is a bug in uses.ink"

[diagnostic."engine.decision.missing"]
severity = "error"
fault = "ours"
fields = { decision = "decision" }
message = "`{decision}` was never decided"
fix = "report it: this is a bug in uses.ink"

[diagnostic."engine.header.invalid"]
severity = "error"
fault = "ours"
fields = { header = "text" }
message = "the engine's own `{header}` header does not parse"
fix = "report it: this is a bug in uses.ink"

[diagnostic."engine.route.invalid"]
severity = "error"
fault = "ours"
fields = { written = "text" }
message = "the engine's own route `{written}` does not parse"
fix = "report it: this is a bug in uses.ink"

[diagnostic."engine.path.invalid"]
severity = "error"
fault = "ours"
fields = { written = "text" }
message = "the engine's own path `{written}` does not parse"
fix = "report it: this is a bug in uses.ink"

[diagnostic."engine.language.invalid"]
severity = "error"
fault = "ours"
fields = { written = "text" }
message = "the engine's own language `{written}` does not parse"
fix = "report it: this is a bug in uses.ink"

[diagnostic."engine.route.repeated"]
severity = "error"
fault = "ours"
fields = { route = "route" }
message = "the engine served {route} twice"
fix = "report it: this is a bug in uses.ink"

[diagnostic."engine.site.refused"]
severity = "error"
fault = "ours"
message = "the site refused the parts interpreting gave it"
fix = "report it: this is a bug in uses.ink"

[diagnostic."engine.xml.unwritten"]
severity = "error"
fault = "ours"
fields = { route = "route" }
message = "{route} could not be written"
fix = "report it: this is a bug in uses.ink"

[diagnostic."engine.date.unrepresentable"]
severity = "error"
fault = "ours"
fields = { date = "text" }
message = "{date} has no instant a feed can write"
fix = "report it: this is a bug in uses.ink"

[diagnostic."source.budget.bytes"]
severity = "error"
fault = "author"
fields = { size = "bytes", limit = "bytes" }
message = "the source holds {size}; a site may hold {limit}"
fix = "move large files that are not part of the site out of the folder"

[diagnostic."source.link.outside"]
severity = "error"
fault = "author"
fields = { path = "path" }
message = "{path} links to a place outside the folder, which is never read"
fix = "copy what it links to into the folder"

[diagnostic."source.link.cycle"]
severity = "error"
fault = "author"
fields = { path = "path" }
message = "{path} links to a folder that holds it, so reading it would never end"
fix = "remove the link"

[diagnostic."source.name.invalid"]
severity = "error"
fault = "author"
fields = { written = "text" }
message = "`{written}` is not a name a site can hold"
fix = "rename it: a name is UTF-8 text without `\\`"

[diagnostic."source.file.special"]
severity = "error"
fault = "author"
fields = { path = "path" }
message = "{path} is neither a file nor a folder, so it cannot be read"
fix = "move it out of the folder"

[diagnostic."source.root.unreadable"]
severity = "error"
fault = "operator"
fields = { reason = "text" }
message = "the folder could not be read: {reason}"

[diagnostic."source.blob.unwritable"]
severity = "error"
fault = "operator"
fields = { reason = "text" }
message = "a file's bytes could not be stored: {reason}"

[diagnostic."math.syntax.invalid"]
severity = "warning"
fault = "author"
fields = { tex = "text", reason = "text" }
message = "the math `{tex}` does not parse, so it is shown as written: {reason}"
fix = "fix the TeX between the `$` signs"

[notice."notice.default.chosen"]
fields = { decision = "decision", value = "text" }
message = "nothing decided `{decision}`, so it is {value}"
fix = "pin `{decision}` in ink.toml to choose"

[notice."heading.anchor.generated"]
fields = { anchor = "text" }
message = "a heading has no letters or digits, so its anchor is `{anchor}`"

[notice."footnote.name.generated"]
fields = { name = "text", given = "text" }
message = "the footnote `{given}` has no letters or digits, so its name is `{name}`"

[notice."callout.kind.unknown"]
fields = { kind = "text" }
message = "the callout kind `{kind}` has no name a theme can use, so it is shown as a note"

[notice."site.home.generated"]
message = "no home page was found, so the home page lists every page"
fix = "add index.md or README.md at the root, or pin `site.home`"

[notice."fact.date.bound"]
fields = { decision = "decision", bound = "text" }
message = "only a bound is known for `{decision}`, not after {bound}, so it is not used"
fix = "write the date in the frontmatter, or pin `{decision}`"

[notice."feed.post.undated"]
message = "the post has no date, so the feeds leave it out"
fix = "write `date:` in its frontmatter, or pin `page.date`"

[notice."feed.post.none"]
message = "the site has no dated posts, so it has no feeds"

[notice."source.output.skipped"]
fields = { path = "path" }
message = "{path} holds the build's own output, so it is not read"

[notice."build.address.default"]
fields = { address = "text" }
message = "no address was given, so feeds, the sitemap and canonical links use {address}"
fix = "pass `--base <url>` with the address the site is served at"

[notice."code.language.unknown"]
fields = { language = "text" }
message = "no grammar knows the language `{language}`, so its code is shown without highlighting"
fix = "write a language the highlighter knows after the opening fence, such as `rust` or `toml`"
