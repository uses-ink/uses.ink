# Every diagnostic and notice uses.ink can emit: its code, how bad it is, whose move it is, its
# typed fields and its English wording. `cargo xtask diag` turns this file into the `Problem` and
# `Announcement` enums (model/src/generated.rs) and their wording (diag/src/generated.rs);
# `cargo xtask check` fails when either is stale.
#
# A code is `noun.noun.reason`: three kebab-case words joined by `.`.
# severity: error | warning | note. fault: author | source | operator | ours.
# Field types: path, paths, route, text, count, bytes, span, decision (a decision code, `AnyCode`).
# message and fix are templates: `{field}` is a declared field, `{{` and `}}` are braces.
# Notices are not problems, so they have no severity and no fault.
# A field name means one thing in every entry that has it, so `[field]` documents each name once
# and the generated field carries that doc; a name without one, or a doc no entry uses, fails.

[field]
hash = "The BLAKE3 of its bytes, in hex."
origin = "Where it came from: `bundled`, or the file it was read from."
address = "The address used, as written."
anchor = "The anchor given to the heading."
asked = "How many were asked for."
at = "The byte offset where the file stops being UTF-8."
bound = "The latest the date can be."
candidates = "Every file it could mean, in path order."
commit = "The commit, as git writes its id."
component = "The deploy the plugins built as components built."
count = "How many there are."
date = "The date, as written."
decision = "The decision code it is about."
element = "The element's name."
entry = "The cache entry, as its kind and digest: `image/<hash>`."
expected = "What the key takes, worded for a person."
file = "The file that also routes there."
folder = "The folder on disk, as the system names it."
format = "The format plugin's id."
files = "Every file involved, in path order."
given = "The name as the author wrote it."
grant = "The name of the credential, never its value."
header = "The header's name."
height = "Its height in pixels."
key = "The key, as written."
kind = "The kind, as written."
language = "The language, as written after the opening fence."
limit = "The most that is allowed."
name = "The name given instead."
other = "The key written before it that sets the same thing."
policy = "What the builder allows, as its setting is named."
native = "The deploy the native plugins built."
plugin = "The plugin's name."
path = "The file."
reason = "Why, as the part that refused it says."
reused = "How many were taken from the cache."
rendered = "How many were made again."
route = "The route."
scheme = "The kind of address, as written before `://`."
segment = "The segment of the path, as written."
size = "How large it is."
table = "The table, as written."
target = "The file it points at."
tex = "The TeX, as written."
theme = "The theme's name."
value = "The value taken, in the decision code's words."
width = "Its width in pixels."
written = "The text, as written."
request_target = "The request target as it was sent: the path and the query."
right = "The right the call needs: `read`, `deploy`, `edit`, `destroy`, `keys` or `members`."
scope = "Where the right was needed: `account`, or `site`."
seconds = "How many seconds."
server_time = "What time the server thinks it is, as an RFC 3339 timestamp (UTC)."
was = "The relying party id the first passkey was made under."
now = "The relying party id the server is configured with now."
passkeys = "How many passkeys are registered."
since = "When it happened, as an RFC 3339 timestamp (UTC)."
skew = "How many seconds the request's time is from the server's."
token_file = "The file that holds the retired owner token."
window = "How many seconds either side of the server's time a request may be."

[diagnostic."config.syntax.invalid"]
severity = "error"
fault = "author"
fields = { reason = "text" }
message = "ink.toml does not parse: {reason}"
fix = "fix the TOML at the marked place; nothing else in ink.toml is read until it parses"

[diagnostic."config.key.unknown"]
severity = "error"
fault = "author"
fields = { key = "text" }
message = "`{key}` is not a key ink.toml has"
fix = "remove it; `ink pin <path> <code>` writes a pin where it belongs"

[diagnostic."config.key.misplaced"]
severity = "error"
fault = "author"
fields = { key = "text", table = "text" }
message = "`{key}` pins one file, so it is written in that file's table, not in `[{table}]`"
fix = "move it under the file it pins, such as `[{table}.\"posts/x.md\"]`"

[diagnostic."config.value.invalid"]
severity = "error"
fault = "author"
fields = { key = "text", expected = "text" }
message = "`{key}` takes {expected}"

[diagnostic."frontmatter.syntax.invalid"]
severity = "warning"
fault = "author"
fields = { reason = "text" }
message = "the frontmatter does not parse, so the page is built without it: {reason}"
fix = "fix the YAML between the `---` lines"

[diagnostic."frontmatter.value.invalid"]
severity = "warning"
fault = "author"
fields = { key = "text", expected = "text" }
message = "the frontmatter's `{key}` takes {expected}, so it is ignored"
fix = "change the value at the marked place, or remove the key"

[diagnostic."frontmatter.key.conflict"]
severity = "warning"
fault = "author"
fields = { key = "text", other = "text" }
message = "the frontmatter's `{key}` sets the same thing as `{other}` before it, so it is ignored"
fix = "keep one of the two keys"

[diagnostic."source.file.encoding"]
severity = "error"
fault = "author"
fields = { at = "count" }
message = "the file is not UTF-8 text (byte {at}), so it is read as empty"
fix = "save the file as UTF-8"

[diagnostic."link.target.missing"]
severity = "warning"
fault = "author"
fields = { written = "text" }
message = "`{written}` points at no file, so it is shown as plain text"

[diagnostic."link.anchor.missing"]
severity = "warning"
fault = "author"
fields = { written = "text" }
message = "`{written}` points at no heading of this page, so the link goes nowhere"
fix = "write the anchor of a heading of the page, or remove the link"

[diagnostic."link.target.ambiguous"]
severity = "error"
fault = "author"
fields = { written = "text", candidates = "paths" }
message = "`{written}` could be any of {candidates}"
fix = "write the path of the one you mean"

[diagnostic."link.target.unpublished"]
severity = "warning"
fault = "author"
fields = { written = "text", target = "path" }
message = "`{written}` points at {target}, which is not published, so it is shown as plain text"
fix = "publish {target}, or remove the link"

[diagnostic."page.route.collision"]
severity = "error"
fault = "author"
fields = { route = "route", files = "paths" }
message = "{files} all route to {route}"
fix = "pin a different `page.slug` on all but one"

[diagnostic."html.element.stripped"]
severity = "warning"
fault = "author"
fields = { element = "text" }
message = "`<{element}>` is not allowed in a page and was removed"

[diagnostic."page.nesting.deep"]
severity = "warning"
fault = "author"
fields = { limit = "count" }
message = "blocks or inlines nested more than {limit} deep keep only their text"
fix = "nest lists, quotes and emphasis less deeply"

[diagnostic."source.file.unreadable"]
severity = "error"
fault = "source"
fields = { path = "path", reason = "text" }
message = "{path} could not be read: {reason}"

[diagnostic."source.budget.files"]
severity = "error"
fault = "author"
fields = { count = "count", limit = "count" }
message = "the source holds {count} files; a site may hold {limit}"
fix = "exclude folders that are not part of the site in ink.toml"

[diagnostic."source.budget.file"]
severity = "error"
fault = "author"
fields = { path = "path", size = "bytes", limit = "bytes" }
message = "{path} is {size}; a file may be {limit}"

[diagnostic."theme.route.collision"]
severity = "error"
fault = "author"
fields = { route = "route", theme = "text", file = "path" }
message = "the theme `{theme}` serves {route}, which {file} also routes to"
fix = "pin a different `page.slug` on {file}"

[diagnostic."render.page.failed"]
severity = "error"
fault = "ours"
fields = { reason = "text" }
message = "the page could not be rendered: {reason}"

[diagnostic."link.target.asset"]
severity = "warning"
fault = "author"
fields = { written = "text", target = "path" }
message = "`{written}` points at {target}, a file that is not a page, so it is shown as plain text"
fix = "link to a page, or show {target} as an image"

[diagnostic."pin.target.unpublished"]
severity = "error"
fault = "author"
fields = { decision = "decision", path = "path" }
message = "`{decision}` names {path}, which is not a published page"
fix = "pin a published page, or publish {path}"

[diagnostic."route.segment.unnamed"]
severity = "warning"
fault = "author"
fields = { path = "path", segment = "text" }
message = "`{segment}` in {path} has no letter or digit, so the route leaves it out"
fix = "rename it, or pin `page.slug`"

[diagnostic."asset.media.unknown"]
severity = "warning"
fault = "author"
fields = { path = "path" }
message = "{path} is a kind of file uses.ink does not serve, so it is left out"

[diagnostic."theme.route.reserved"]
severity = "error"
fault = "author"
fields = { route = "route", theme = "text" }
message = "the theme `{theme}` serves {route}, which uses.ink serves itself"
fix = "choose another theme, or ask its author to move the file"

[diagnostic."theme.page.refused"]
severity = "error"
fault = "author"
fields = { theme = "text" }
message = "the theme `{theme}` could not render the page"
fix = "see the cause below; choose another theme if it persists"

[diagnostic."source.blob.missing"]
severity = "error"
fault = "ours"
fields = { path = "path" }
message = "{path} is in the snapshot, but its bytes are not in the blob store"
fix = "build again; report it if it persists"

[diagnostic."engine.decision.repeated"]
severity = "error"
fault = "ours"
fields = { decision = "decision" }
message = "`{decision}` was decided twice"
fix = "report it: this is a bug in uses.ink"

[diagnostic."engine.decision.missing"]
severity = "error"
fault = "ours"
fields = { decision = "decision" }
message = "`{decision}` was never decided"
fix = "report it: this is a bug in uses.ink"

[diagnostic."page.publish.unstated"]
severity = "error"
fault = "ours"
fields = { decision = "decision" }
message = "this file would be published in a vault or private source by `{decision}`, and nothing the writer stated selects it, so nothing is published"
fix = "report it: this is a bug in uses.ink; `ink explain --why` shows the rule that published it"

[diagnostic."engine.decision.unstable"]
severity = "warning"
fault = "ours"
fields = { decision = "decision" }
message = "`{decision}` changed since the previous build, and nothing in the site did: the content, ink.toml, the plugins and the source's abilities are the same"
fix = "nothing to do in the site; if the new value is wrong, report it with what `ink explain --why` shows"

[diagnostic."engine.header.invalid"]
severity = "error"
fault = "ours"
fields = { header = "text" }
message = "the engine's own `{header}` header does not parse"
fix = "report it: this is a bug in uses.ink"

[diagnostic."engine.route.invalid"]
severity = "error"
fault = "ours"
fields = { written = "text" }
message = "the engine's own route `{written}` does not parse"
fix = "report it: this is a bug in uses.ink"

[diagnostic."engine.path.invalid"]
severity = "error"
fault = "ours"
fields = { written = "text" }
message = "the engine's own path `{written}` does not parse"
fix = "report it: this is a bug in uses.ink"

[diagnostic."engine.language.invalid"]
severity = "error"
fault = "ours"
fields = { written = "text" }
message = "the engine's own language `{written}` does not parse"
fix = "report it: this is a bug in uses.ink"

[diagnostic."engine.route.repeated"]
severity = "error"
fault = "ours"
fields = { route = "route" }
message = "the engine served {route} twice"
fix = "report it: this is a bug in uses.ink"

[diagnostic."engine.site.refused"]
severity = "error"
fault = "ours"
message = "the site refused the parts interpreting gave it"
fix = "report it: this is a bug in uses.ink"

[diagnostic."engine.xml.unwritten"]
severity = "error"
fault = "ours"
fields = { route = "route" }
message = "{route} could not be written"
fix = "report it: this is a bug in uses.ink"

[diagnostic."engine.key.unwritten"]
severity = "warning"
fault = "ours"
fields = { path = "path" }
message = "the cache key of {path} could not be made, so the page is rendered again by every build"
fix = "report it: this is a bug in uses.ink"

[diagnostic."engine.date.unrepresentable"]
severity = "error"
fault = "ours"
fields = { date = "text" }
message = "{date} has no instant a feed can write"
fix = "report it: this is a bug in uses.ink"

[diagnostic."engine.image.miscounted"]
severity = "error"
fault = "ours"
fields = { count = "count", asked = "count" }
message = "the host prepared {count} images when {asked} were asked for"
fix = "report it: this is a bug in uses.ink"

[diagnostic."source.budget.bytes"]
severity = "error"
fault = "author"
fields = { size = "bytes", limit = "bytes" }
message = "the source holds {size}; a site may hold {limit}"
fix = "move large files that are not part of the site out of the folder"

[diagnostic."source.link.outside"]
severity = "error"
fault = "author"
fields = { path = "path" }
message = "{path} links to a place outside the folder, which is never read"
fix = "copy what it links to into the folder"

[diagnostic."source.link.cycle"]
severity = "error"
fault = "author"
fields = { path = "path" }
message = "{path} links to a folder that holds it, so reading it would never end"
fix = "remove the link"

[diagnostic."source.name.invalid"]
severity = "error"
fault = "author"
fields = { written = "text" }
message = "`{written}` is not a name a site can hold"
fix = "rename it: a name is UTF-8 text without `\\`"

[diagnostic."source.file.special"]
severity = "error"
fault = "author"
fields = { path = "path" }
message = "{path} is neither a file nor a folder, so it cannot be read"
fix = "move it out of the folder"

[diagnostic."source.root.unreadable"]
severity = "error"
fault = "operator"
fields = { reason = "text" }
message = "the folder could not be read: {reason}"

[diagnostic."source.blob.unwritable"]
severity = "error"
fault = "operator"
fields = { reason = "text" }
message = "a file's bytes could not be stored: {reason}"

[diagnostic."source.budget.folders"]
severity = "error"
fault = "author"
fields = { limit = "count" }
message = "the source holds more than {limit} folders, the most a site may hold"
fix = "move folders that are not part of the site out of the folder"

[diagnostic."source.repository.unreadable"]
severity = "error"
fault = "source"
fields = { reason = "text" }
message = "the git repository could not be read: {reason}"
fix = "check the repository with `git fsck`, or build the files as a folder with `--source folder`"

[diagnostic."source.git.network"]
severity = "error"
fault = "operator"
fields = { scheme = "text", policy = "text" }
message = "this builder does not fetch {scheme} repositories: its network access is {policy}"
fix = "the operator of the builder allows it, or the site is built from a folder"

[diagnostic."source.git.auth"]
severity = "error"
fault = "source"
fields = { grant = "text" }
message = "the repository is fetched with the credential `{grant}`, which this builder does not hold"
fix = "give the builder a credential of that name, or make the repository public"

[diagnostic."source.git.transport"]
severity = "error"
fault = "ours"
fields = { scheme = "text" }
message = "this builder has no way to fetch {scheme} repositories yet"
fix = "build the site from a folder or a local repository"

[diagnostic."source.git.revision"]
severity = "error"
fault = "author"
fields = { written = "text" }
message = "`{written}` names no branch, tag or commit of the fetched repository"
fix = "name a branch, tag or commit that the repository holds"

[diagnostic."source.budget.objects"]
severity = "error"
fault = "author"
fields = { count = "count", limit = "count" }
message = "the source holds {count} git objects; a site may hold {limit}"
fix = "fetch a shorter history, or move large generated files out of the repository"

[diagnostic."source.revision.unknown"]
severity = "error"
fault = "author"
fields = { written = "text", reason = "text" }
message = "`{written}` names no commit of the repository: {reason}"
fix = "pass a branch, tag or commit id that exists, or leave out `--rev` to read HEAD"

[diagnostic."source.link.broken"]
severity = "error"
fault = "author"
fields = { path = "path", written = "text" }
message = "{path} links to `{written}`, which the commit does not hold as a file or folder"
fix = "commit what it links to, or remove the link"

[diagnostic."math.syntax.invalid"]
severity = "warning"
fault = "author"
fields = { tex = "text", reason = "text" }
message = "the math `{tex}` does not parse, so it is shown as written: {reason}"
fix = "fix the TeX between the `$` signs"

[diagnostic."image.budget.pixels"]
severity = "error"
fault = "author"
fields = { path = "path", width = "count", height = "count", limit = "count" }
message = "{path} is {width} by {height} pixels; an image may hold {limit} pixels"
fix = "export a smaller copy of it and publish that"

[diagnostic."image.decode.failed"]
severity = "error"
fault = "author"
fields = { path = "path", reason = "text" }
message = "{path} could not be read as an image: {reason}"
fix = "export it again from an image editor, or remove it from the pages that show it"

[diagnostic."image.encode.failed"]
severity = "error"
fault = "ours"
fields = { path = "path", reason = "text" }
message = "the copies of {path} could not be made: {reason}"
fix = "report it: this is a bug in uses.ink"

[diagnostic."block.id.taken"]
severity = "warning"
fault = "author"
fields = { given = "text", name = "text" }
message = "the block id `^{given}` is already an anchor of this page, so it is anchored `{name}` and links to `^{given}` reach the first"
fix = "give the block an id no heading or other block of the page has"

[diagnostic."embed.target.cycle"]
severity = "warning"
fault = "author"
fields = { written = "text", files = "paths" }
message = "`{written}` is embedded inside itself, through {files}, so the inner embed is shown as a link"
fix = "remove one of the embeds"

[diagnostic."embed.anchor.missing"]
severity = "warning"
fault = "author"
fields = { written = "text" }
message = "`{written}` names no heading or block of the page it embeds, so it is shown as a link"
fix = "write the text of a heading of that page, or a block id it has"

[diagnostic."embed.budget.count"]
severity = "warning"
fault = "author"
fields = { written = "text", limit = "count" }
message = "the page embeds more than {limit} pages, embeds inside embeds counted, so `{written}` is shown as a link"
fix = "embed fewer pages, or link to some of them"

[diagnostic."vault.settings.invalid"]
severity = "warning"
fault = "author"
fields = { path = "path", reason = "text" }
message = "`{path}` is not Obsidian's settings as uses.ink reads them: {reason}"
fix = "fix the file, or let Obsidian write it again; until then attachments resolve as if no attachment folder were set"

[diagnostic."auth.signature.malformed"]
severity = "error"
fault = "author"
fields = { header = "text" }
message = "the {header} header is not an `Ink-Sig-1` value"
fix = "update `ink`; a script that signs its own requests follows the profile in docs/auth.md"

[diagnostic."auth.target.not-canonical"]
severity = "error"
fault = "author"
fields = { request_target = "text" }
message = "the request target `{request_target}` is not in canonical form"
fix = "escape with upper-case hex, sort the query, drop empty pairs; `ink` does this itself"

[diagnostic."auth.signature.skewed"]
severity = "error"
fault = "source"
fields = { skew = "count", window = "count", server_time = "text" }
message = "the request's time is {skew} seconds from the server's (`{server_time}`), over the allowed {window}"
fix = "set this machine's clock, for example `timedatectl set-ntp true`"

[diagnostic."auth.signature.refused"]
severity = "error"
fault = "source"
message = "the server did not accept the signature"
fix = "run `ink login` to sign in again on this machine"

[diagnostic."auth.key.revoked"]
severity = "error"
fault = "source"
fields = { since = "text" }
message = "this key was revoked on {since}"
fix = "run `ink login`; for CI, make a new key with `ink key add`"

[diagnostic."auth.key.expired"]
severity = "error"
fault = "source"
fields = { since = "text" }
message = "this key expired on {since}"
fix = "run `ink login`; for CI, make a new key with `ink key add`"

[diagnostic."auth.signature.replayed"]
severity = "error"
fault = "ours"
message = "a request with the same nonce was already seen"
fix = "send a new request; a client that reuses a nonce has a bug"

[diagnostic."auth.signature.flooded"]
severity = "error"
fault = "source"
fields = { window = "count" }
message = "this key sent more signed requests than the server remembers inside {window} seconds"
fix = "slow down, and try again in a few seconds"

[diagnostic."auth.digest.mismatch"]
severity = "error"
fault = "author"
message = "the body is not the one that was signed"
fix = "send it again; a proxy that changes bodies must not sit between"

[diagnostic."auth.server.restarting"]
severity = "error"
fault = "operator"
fields = { seconds = "count" }
message = "the server just started and takes signed requests again in {seconds} seconds"
fix = "wait; `ink` retries once"

[diagnostic."auth.right.missing"]
severity = "error"
fault = "author"
fields = { right = "text", scope = "text" }
message = "this key may not do this: it has no `{right}` on the {scope}"
fix = "use a key with the right, or approve one with `ink key add`"

[diagnostic."auth.enrolment.expired"]
severity = "error"
fault = "source"
message = "that code is unknown or has expired"
fix = "run `ink login` again"

[diagnostic."auth.enrolment.denied"]
severity = "error"
fault = "source"
message = "the request was not approved"
fix = "run `ink login` again if it was a mistake"

[diagnostic."auth.enrolment.limited"]
severity = "error"
fault = "source"
fields = { seconds = "count" }
message = "enrolment is closed for {seconds} seconds after too many requests"
fix = "wait, then run `ink login` again"

[diagnostic."auth.enrolment.lifetime"]
severity = "error"
fault = "author"
fields = { asked = "count", limit = "count" }
message = "a key of {asked} days is over this server's ceiling of {limit} days"
fix = "ask for {limit} days or fewer with `--expires`"

[diagnostic."auth.enrolment.site"]
severity = "error"
fault = "author"
message = "a deploy key is for one site of the account that approves it, and this is not one"
fix = "name a site of this account with `--site`"

[diagnostic."auth.enrolment.rights"]
severity = "error"
fault = "author"
message = "a key cannot have more rights than the person who approves it"
fix = "ask for fewer rights with `--right`"

[diagnostic."auth.enrolment.mismatch"]
severity = "error"
fault = "source"
message = "the fingerprint is not the one of the request"
fix = "compare the fingerprint with the terminal that ran `ink login`, and approve only if they match"

[diagnostic."auth.enrolment.taken"]
severity = "error"
fault = "author"
message = "that key is already enrolled or waiting for approval"
fix = "use the key you have, or run `ink logout` and `ink login` for a new one"

[diagnostic."auth.key.unknown"]
severity = "error"
fault = "author"
message = "no key of this account has that fingerprint"
fix = "list the keys with `ink key list`"

[diagnostic."auth.enrolment.refused"]
severity = "error"
fault = "author"
message = "the server refused the enrolment"
fix = "run `ink login` again"

[diagnostic."auth.key.operator"]
severity = "error"
fault = "operator"
message = "that key is a line of the operator-keys file, which the API does not change"
fix = "delete its line from `<data>/operator-keys`"

[diagnostic."auth.key.print-refused"]
severity = "error"
fault = "author"
message = "the private key would be printed to a terminal"
fix = "send it to a file with `--out`, or redirect stdout"

[notice."notice.default.chosen"]
fields = { decision = "decision", value = "text" }
message = "nothing decided `{decision}`, so it is {value}"
fix = "pin `{decision}` in ink.toml to choose"

[notice."heading.anchor.generated"]
fields = { anchor = "text" }
message = "a heading has no letters or digits, so its anchor is `{anchor}`"

[notice."footnote.name.generated"]
fields = { name = "text", given = "text" }
message = "the footnote `{given}` has no letters or digits, so its name is `{name}`"

[notice."footnote.name.taken"]
fields = { name = "text", given = "text" }
message = "another footnote already has the name of `{given}`, so its name is `{name}`"
fix = "give the footnotes names that differ in their letters or digits"

[notice."callout.kind.unknown"]
fields = { kind = "text" }
message = "the callout kind `{kind}` has no name a theme can use, so it is shown as a note"

[notice."callout.metadata.ignored"]
fields = { written = "text" }
message = "the callout metadata `{written}` styles a callout in Obsidian's own stylesheets, so it is not kept"

[notice."embed.inline.linked"]
fields = { written = "text" }
message = "`{written}` is embedded where only text fits (a heading, a table cell, a link's text), so it is shown as a link"
fix = "put the embed in a paragraph of its own to show the page"

[notice."embed.size.ignored"]
fields = { written = "text" }
message = "the size `{written}` of an embedded image is not kept: the theme sizes images"

[notice."embed.file.linked"]
fields = { written = "text" }
message = "`{written}` is neither an image nor a note, so it is linked rather than embedded"

[notice."embed.footnote.dropped"]
fields = { written = "text" }
message = "the footnotes of the page `{written}` embeds are not carried into this page, so their references are removed"

[notice."link.target.attached"]
fields = { written = "text", target = "path", candidates = "paths" }
message = "`{written}` could be any of {candidates}, so it is taken as `{target}`, the one in the vault's attachment folder"
fix = "write the path of the one you mean"

[notice."format.obsidian.chosen"]
message = "the folder holds `.obsidian/`, so its markdown is read as Obsidian's"

[notice."format.pin.chosen"]
fields = { format = "text" }
message = "`ink.toml` pins `site.format` to `{format}`, so the markdown is read with it"
fix = "remove the pin to read the folder's markdown by what it holds"

[notice."site.home.generated"]
message = "no home page was found, so the home page lists every page"
fix = "add index.md or README.md at the root, or pin `site.home`"

[notice."fact.date.bound"]
fields = { decision = "decision", bound = "text" }
message = "only a bound is known for `{decision}`, not after {bound}, so it is not used"
fix = "write the date in the frontmatter, or pin `{decision}`"

[notice."feed.post.undated"]
message = "the post has no date, so the feeds leave it out"
fix = "write `date:` in its frontmatter, or pin `page.date`"

[notice."feed.post.none"]
message = "the site has no dated posts, so it has no feeds"

[notice."source.output.skipped"]
fields = { path = "path" }
message = "{path} holds the build's own output, so it is not read"

[notice."file.ignore.inferred"]
fields = { path = "path" }
message = "{path} is hidden, another tool's or about the repository, so it is not part of the site"
fix = "add it to `include` in ink.toml to keep it"

[notice."source.cache.skipped"]
fields = { path = "path" }
message = "{path} is the cache ink keeps between builds, so it is not read"

[notice."source.link.skipped"]
fields = { path = "path" }
message = "{path} links to a folder of the site, which is read at its own path, so the link is not followed"

[notice."source.git.chosen"]
fields = { commit = "text" }
message = "the folder is a git repository, so the site is read from its commit {commit}, not from the files on disk"
fix = "pass `--source folder` to read the files as they are, uncommitted changes included"

[notice."source.history.absent"]
fields = { decision = "decision" }
message = "the source has no history, so `{decision}` is not taken from it"
fix = "write the date in the frontmatter, or build from a git repository"

[notice."source.history.shallow"]
fields = { decision = "decision", commit = "text", bound = "text" }
message = "the history stops at commit {commit}, a shallow clone's boundary, so `{decision}` of a file not changed since is only a bound, not after {bound}"
fix = "fetch the whole history, such as with `git fetch --unshallow`"

[notice."source.history.moved"]
fields = { decision = "decision", count = "count" }
message = "{count} files came to their path by a move, and the history does not follow renames, so their `{decision}` is when they moved"
fix = "write the date in the frontmatter of a moved file, or pin `{decision}`"

[notice."source.submodule.skipped"]
fields = { path = "path" }
message = "{path} is a git submodule, whose files live in another repository, so it is not read"

[notice."source.lfs.pointer"]
fields = { path = "path" }
message = "{path} is a Git LFS pointer, so the site holds the pointer's text, not the file it stands for"
fix = "commit the file itself, or fetch it with `git lfs pull` and build with `--source folder`"

[notice."build.record.unread"]
fields = { reason = "text" }
message = "the previous build's decision record could not be read, so nothing is compared with it: {reason}"
fix = "nothing to do: this build writes a record the next one reads"

[notice."build.address.default"]
fields = { address = "text" }
message = "no address was given, so feeds, the sitemap and canonical links use {address}"
fix = "pass `--base <url>` with the address the site is served at"

[notice."plugin.component.used"]
fields = { plugin = "text", hash = "text", origin = "text" }
message = "the plugin `{plugin}` ran from {origin} (BLAKE3 {hash})"

[notice."code.language.unknown"]
fields = { language = "text" }
message = "no grammar knows the language `{language}`, so its code is shown without highlighting"
fix = "write a language the highlighter knows after the opening fence, such as `rust` or `toml`"

[notice."image.animation.kept"]
fields = { path = "path" }
message = "{path} is animated, so it is served as it is, metadata included, with no smaller copies"

[notice."image.format.kept"]
fields = { path = "path" }
message = "{path} is served as it is, metadata included: uses.ink makes no smaller copies of AVIF images"
fix = "publish a JPEG or PNG of it to get smaller copies with the metadata removed"

[diagnostic."plugin.value.unmirrored"]
severity = "error"
fault = "ours"
fields = { reason = "text" }
message = "a value has no case at the plugin boundary: {reason}"
fix = "build the plugin against the same WIT as the host"

[diagnostic."plugin.value.malformed"]
severity = "error"
fault = "ours"
fields = { plugin = "text", reason = "text" }
message = "the plugin `{plugin}` sent a value the model refuses: {reason}"
fix = "the plugin has a bug; report it to its author"

[diagnostic."plugin.call.trapped"]
severity = "error"
fault = "ours"
fields = { plugin = "text", reason = "text" }
message = "the plugin `{plugin}` stopped: {reason}"
fix = "the plugin has a bug; report it to its author"

[diagnostic."plugin.budget.fuel"]
severity = "error"
fault = "ours"
fields = { plugin = "text", limit = "count" }
message = "the plugin `{plugin}` ran past its {limit} units of fuel in one call"

[diagnostic."plugin.budget.time"]
severity = "error"
fault = "ours"
fields = { plugin = "text", limit = "count" }
message = "the plugin `{plugin}` ran past its {limit} ms in one call"

[diagnostic."plugin.budget.memory"]
severity = "error"
fault = "ours"
fields = { plugin = "text", limit = "bytes" }
message = "the plugin `{plugin}` asked for more than its {limit} of memory"

[diagnostic."plugin.budget.table"]
severity = "error"
fault = "ours"
fields = { plugin = "text", limit = "count" }
message = "the plugin `{plugin}` asked for a table of more than {limit} elements"

[diagnostic."build.check.mismatch"]
severity = "error"
fault = "ours"
fields = { native = "text", component = "text" }
message = "the plugins built as components give deploy {component}, natively {native}"
fix = "a plugin's component and its native core disagree; `ink build` natively is the reference"

[notice."render.cache.cold"]
fields = { folder = "text" }
message = "{folder} held no cache, so everything this build makes is made from scratch"

[notice."render.cache.used"]
fields = { reused = "count", rendered = "count" }
message = "{reused} pages were taken from the cache and {rendered} rendered"

[notice."render.cache.unkeyed"]
fields = { theme = "text" }
message = "the theme {theme} does not say what its pages are made from, so every page is rendered again by every build"

[notice."cache.folder.unusable"]
fields = { folder = "text" }
message = "{folder} cannot hold the cache, so nothing is kept between builds"
fix = "make the folder writable, or pass `--cache <dir>` with one that is"

[notice."cache.entry.corrupt"]
fields = { entry = "text" }
message = "the cache entry {entry} does not match its hash, so it is made again"

[notice."cache.entry.unwritten"]
fields = { entry = "text" }
message = "the cache entry {entry} could not be written, so the next build makes it again"

[notice."cache.entry.evicted"]
fields = { count = "count", limit = "bytes" }
message = "{count} cache entries used longest ago were removed, keeping the cache under {limit}"

[diagnostic."auth.origin.refused"]
severity = "error"
fault = "author"
message = "the request came from an origin that is not this dashboard"
fix = "use the dashboard at its own address; a script uses a signed request"

[diagnostic."auth.passkey.refused"]
severity = "error"
fault = "author"
message = "the passkey was refused"
fix = "try again; if it keeps failing, sign in with an email link and add the passkey again"

[diagnostic."auth.passkey.origin"]
severity = "error"
fault = "author"
message = "the passkey ceremony ran on an origin this server does not serve"
fix = "open the dashboard at the address the operator configured with `--rp-origin`"

[diagnostic."auth.passkey.relying-party"]
severity = "error"
fault = "author"
message = "the passkey is for a different relying party id"
fix = "use a passkey made for this server, or add one here"

[diagnostic."auth.passkey.challenge"]
severity = "error"
fault = "author"
message = "the challenge is unknown, already used, or older than five minutes"
fix = "start the ceremony again"

[diagnostic."auth.passkey.unverified"]
severity = "error"
fault = "author"
message = "the authenticator did not verify you (a PIN, a fingerprint or the like)"
fix = "use an authenticator that verifies you, and approve the prompt"

[diagnostic."auth.passkey.counter"]
severity = "error"
fault = "author"
message = "the passkey's signature counter went backwards, which a cloned key would cause"
fix = "remove the passkey and add a new one; sign in with an email link meanwhile"

[diagnostic."auth.passkey.backup"]
severity = "error"
fault = "author"
message = "the passkey changed whether it is synced between devices"
fix = "remove it and add the passkey again"

[diagnostic."auth.passkey.malformed"]
severity = "error"
fault = "author"
message = "the passkey data could not be read"
fix = "try again; a browser without passkey support cannot sign in this way"

[diagnostic."auth.passkey.algorithm"]
severity = "error"
fault = "author"
message = "the passkey does not use ES256, the one algorithm this server accepts"
fix = "use another authenticator or a platform passkey"

[diagnostic."auth.passkey.taken"]
severity = "error"
fault = "author"
message = "that passkey is already registered"
fix = "sign in with it, or register another authenticator"

[diagnostic."auth.passkey.missing"]
severity = "error"
fault = "author"
message = "no passkey of yours has that id"
fix = "reload the list"

[diagnostic."auth.passkey.label"]
severity = "error"
fault = "author"
message = "the passkey's name is empty or too long"
fix = "use a name of 1 to 64 characters"

[diagnostic."auth.relying-party.changed"]
severity = "error"
fault = "operator"
fields = { was = "text", now = "text", passkeys = "count" }
message = "passkeys were made for `{was}` and the relying party id is now `{now}`; {passkeys} would stop working"
fix = "set `--rp-id {was}` again, or accept that people sign in with an email link and add passkeys anew"

[diagnostic."auth.session.missing"]
severity = "error"
fault = "author"
message = "no session of yours has that id"
fix = "reload the list of sessions"

[diagnostic."auth.rate.limited"]
severity = "error"
fault = "author"
message = "too many requests from this source in a short time"
fix = "wait the seconds in the Retry-After header, then try again"

[notice."auth.token.retired"]
fields = { token_file = "text" }
message = "the owner token in `{token_file}` no longer works"
fix = "sign in with `ink login --data <folder>`, and delete the file"
