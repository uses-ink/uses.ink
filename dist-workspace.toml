[workspace]
members = ["cargo:."]

# Config for `dist` (formerly cargo-dist; the config key and the crate keep the old name)
[dist]
cargo-dist-version = "0.34.0"
ci = "github"
installers = ["shell", "powershell"]
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]
checksum = "sha256"
# one `cargo build -p uses-ink-cli` per target, not `--workspace`: the plugin guests are cdylibs for
# wasm32, and linking them natively fails (found by `cargo xtask release build`)
precise-builds = true
pr-run-mode = "skip"
# release.yml is generated, then checkout is raised to v7 by hand (dist 0.34 emits v6)
allow-dirty = ["ci"]
# `ink` embeds its components (decision 0054): every build job runs `cargo xtask component` first
github-build-setup = "../build-setup.yml"
install-path = "CARGO_HOME"
