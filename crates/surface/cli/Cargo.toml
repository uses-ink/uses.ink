axum.workspace = true
blob.workspace = true
blob-dir.workspace = true
build.workspace = true
build-process.workspace = true
clock.workspace = true
control.workspace = true
db.workspace = true
db-sqlite.workspace = true
edge-api.workspace = true
web.workspace = true
sig.workspace = true
edge-control.workspace = true
clap.workspace = true
clap_complete.workspace = true
clap_complete_nushell.workspace = true
clap_mangen.workspace = true
config.workspace = true
diag.workspace = true
edge.workspace = true
edge-axum.workspace = true
edge-folder = { workspace = true, features = ["files"] }
engine.workspace = true
format-markdown.workspace = true
format-obsidian.workspace = true
host-image.workspace = true
host-native.workspace = true
https.workspace = true
host-wasmtime.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
jiff.workspace = true
