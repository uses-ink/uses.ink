serde_json.workspace = true
terminal_size.workspace = true
theme-quiet.workspace = true
tokio = { workspace = true, features = ["net", "signal"] }
toml.workspace = true
logging = { workspace = true, features = ["layers"] }
unicode-width.workspace = true
watch.workspace = true
watch-git.workspace = true

[build-dependencies]
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
divan.workspace = true
fixture.workspace = true
# test repositories are written object by object
gix.workspace = true
insta.workspace = true
logging = { workspace = true, features = ["capture"] }
tempfile.workspace = true
proptest.workspace = true
# the software authenticator of the passkey test
p256.workspace = true
serde_cbor_2.workspace = true
sha2.workspace = true

[[bench]]
name = "site"
harness = false

[[bench]]
name = "incremental"
harness = false

# `publish = false` hides the binary from dist; this puts it back (dist-workspace.toml)
[package.metadata.dist]
dist = true

[lints]
workspace = true
