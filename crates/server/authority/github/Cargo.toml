[package]
name = "uses-ink-authority-github"
description = "The GitHub authority (`ink:authority-github`): webhook signature check, App JWT and installation token exchange, ownership by installation, and commit statuses, through a Transport port with a fake"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
authority-forge.workspace = true
base64.workspace = true
build.workspace = true
jiff.workspace = true
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true

# on a Worker the App key signs through ring, whose randomness there is crypto.getRandomValues
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
ring = { workspace = true, features = ["wasm32_unknown_unknown_js"] }

[dev-dependencies]
pollster.workspace = true

[lints]
workspace = true
