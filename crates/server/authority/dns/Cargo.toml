[package]
name = "uses-ink-authority-dns"
description = "The DNS authority (`ink:authority-dns`): a TXT record at `_uses-ink.<name>` that binds a custom domain to a site, read through a Resolver port with a fake"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

# The resolver that asks real nameservers needs sockets, so it is the `system` feature: the API on
# a Worker builds this crate without it (decision 0130).
[features]
default = ["system"]
system = ["dep:clock", "dep:tokio", "tokio/net"]

[dependencies]
clock = { workspace = true, optional = true }
control.workspace = true
jiff.workspace = true
tokio = { workspace = true, optional = true }

[dev-dependencies]
blob-dir.workspace = true
db.workspace = true
db-sqlite.workspace = true
build.workspace = true
model.workspace = true
pollster.workspace = true
queue-rows.workspace = true
secret-local.workspace = true
tempfile.workspace = true

[lints]
workspace = true
