[package]
name = "uses-ink-authority-repo"
description = "The repository authority: claim, prove and release a site's repository over a forge transport, with the real https transport behind the `system` feature"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

# The transport that reaches a forge needs sockets, so it is the `system` feature: the API on a
# Worker builds this crate without it (decision 0130).
[features]
default = ["system"]
system = ["dep:https", "dep:url"]

[dependencies]
authority-forge.workspace = true
authority-forgejo.workspace = true
authority-github.workspace = true
authority-gitlab.workspace = true
clock.workspace = true
control.workspace = true
https = { workspace = true, optional = true }
jiff.workspace = true
secret.workspace = true
url = { workspace = true, optional = true }

[dev-dependencies]
https.workspace = true
blob-dir.workspace = true
build.workspace = true
db.workspace = true
db-sqlite.workspace = true
model.workspace = true
pollster.workspace = true
queue-rows.workspace = true
rcgen.workspace = true
rustls.workspace = true
secret-local.workspace = true
tempfile.workspace = true
tokio.workspace = true

[lints]
workspace = true
