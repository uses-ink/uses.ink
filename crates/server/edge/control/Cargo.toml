[package]
name = "uses-ink-edge-control"
description = "The edge's host-to-deploy port over the control plane: a site's live deploy, read from its manifest, with the blobs served from the blob store's files"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
blob.workspace = true
blob-dir = { workspace = true, optional = true }
clock.workspace = true
control.workspace = true
edge.workspace = true
edge-folder = { workspace = true, optional = true, features = ["files"] }
jiff.workspace = true
model.workspace = true
tokio = { workspace = true, optional = true }
logging.workspace = true

[features]
default = ["files"]
# the lookup that serves files of the blob store and answers across a channel (what `ink serve` runs);
# a Worker has neither files nor a second task, so it builds the crate without it
files = ["dep:blob-dir", "dep:edge-folder", "dep:tokio"]

[dev-dependencies]
db.workspace = true
db-sqlite.workspace = true
build.workspace = true
clock.workspace = true
pollster.workspace = true
queue-rows.workspace = true
secret-local.workspace = true
tempfile.workspace = true

[lints]
workspace = true
