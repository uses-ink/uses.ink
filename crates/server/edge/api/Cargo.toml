[package]
name = "uses-ink-edge-api"
description = "The edge's API and intake: typed routes over the control plane, signature authentication through a port, and bounded intake of a built folder as a tar archive"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
logging.workspace = true
authority-dns.workspace = true
blake3.workspace = true
blob.workspace = true
build.workspace = true
clock.workspace = true
control.workspace = true
db.workspace = true
edge-folder.workspace = true
jiff.workspace = true
mail.workspace = true
model.workspace = true
serde.workspace = true
serde_json.workspace = true
sig.workspace = true
url.workspace = true
webauthn-rs-core.workspace = true

# the Worker target (spikes/passkeys): rand and uuid, under the WebAuthn verifier, need their JavaScript entropy
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
uuid = { version = "1", features = ["js"] }

[dev-dependencies]
p256.workspace = true
sea-query.workspace = true
serde_cbor_2.workspace = true
sha2.workspace = true
logging = { workspace = true, features = ["capture"] }
blob-dir.workspace = true
build.workspace = true
db-sqlite.workspace = true
pollster.workspace = true
queue-rows.workspace = true
secret-local.workspace = true
tempfile.workspace = true

[lints]
workspace = true
