[package]
name = "uses-ink-secret-seal"
description = "The sealing every secret adapter shares: XChaCha20-Poly1305 with the row as associated data, over a key the adapter brings"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
chacha20poly1305.workspace = true
rand_core.workspace = true
secret.workspace = true
zeroize.workspace = true

# on a Worker the operating system's randomness is crypto.getRandomValues, which getrandom 0.2 reads through its `js` feature
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
pollster.workspace = true

[lints]
workspace = true
