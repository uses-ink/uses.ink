name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the version, components and wasm targets.
      - run: rustup show active-toolchain
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny,wasmtime
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo nextest run --workspace
      - run: cargo test --workspace --doc
      - run: cargo deny check
      # The pen draws the same bytes on wasm: its golden fixture runs there too.
      - run: cargo test -p freehand --target wasm32-wasip2
      - run: cargo build -p freehand --target wasm32-unknown-unknown
      - run: cargo xtask check
