name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the version, components and wasm targets.
      - run: rustup show active-toolchain
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny,wasmtime
      # The whole gate, in one place: fmt, clippy, nextest, doc tests, cargo deny, wasm tests and
      # builds, layout and generated files (xtask/src/check.rs).
      - run: cargo --locked xtask check
