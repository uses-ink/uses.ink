[package]
name = "spike-hosted-api"
description = "H0b spike (a): the API crates with webauthn-rs-core as a Worker, and a passkey ceremony run in workerd"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = "=0.9.0"
# The API crate itself does not build for wasm32-unknown-unknown (tokio's `net` through `clock` and
# `edge-folder`, see 0096), so its WebAuthn adapter is compiled from its source file, and the crates
# it stands on are depended on as they are.
edge = { package = "uses-ink-edge", path = "../../../crates/server/edge" }
blob = { package = "uses-ink-blob", path = "../../../crates/port/blob" }
build = { package = "uses-ink-build", path = "../../../crates/port/build" }
db = { package = "uses-ink-db", path = "../../../crates/port/db" }
mail = { package = "uses-ink-mail", path = "../../../crates/port/mail" }
queue = { package = "uses-ink-queue", path = "../../../crates/port/queue" }
secret = { package = "uses-ink-secret", path = "../../../crates/port/secret" }
webauthn-rs-core = "=0.6.2"
url = "2.5.9"
serde = { version = "1", features = ["derive"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
uuid = { version = "1", features = ["js"] }
control = { package = "uses-ink-control", path = "../../../crates/server/control" }
sig = { package = "uses-ink-sig", path = "../../../crates/core/sig" }
serde_json = "1"
p256 = { version = "0.14", default-features = false, features = ["ecdsa"] }
serde_cbor_2 = "0.13.0"
sha2 = "0.11"
