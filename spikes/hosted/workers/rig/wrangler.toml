# Local only: `cargo xtask worker <suite>`. Never deployed.
name = "spike-hosted-rig"
main = "build/index.js"
compatibility_date = "2026-11-01"

[[d1_databases]]
binding = "DB"
database_name = "rig"
database_id = "00000000-0000-0000-0000-000000000000"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "rig"
