[package]
name = "spike-hosted-rig"
description = "The test Worker of the hosted adapters: runs a conformance suite's cases, one call each, on a D1 binding in workerd"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "=0.9.0", features = ["d1", "queue"] }
db = { package = "uses-ink-db", path = "../../../../crates/port/db" }
db-conformance = { package = "uses-ink-db-conformance", path = "../../../../crates/port/db/conformance" }
db-d1 = { package = "uses-ink-db-d1", path = "../../../../crates/port/db/d1" }
blob-conformance = { package = "uses-ink-blob-conformance", path = "../../../../crates/port/blob/conformance" }
blob-r2 = { package = "uses-ink-blob-r2", path = "../../../../crates/port/blob/r2" }
queue-cf = { package = "uses-ink-queue-cf", path = "../../../../crates/port/queue/cf" }
queue-conformance = { package = "uses-ink-queue-conformance", path = "../../../../crates/port/queue/conformance" }
queue-rows = { package = "uses-ink-queue-rows", path = "../../../../crates/port/queue/rows" }
secret-conformance = { package = "uses-ink-secret-conformance", path = "../../../../crates/port/secret/conformance" }
secret-worker = { package = "uses-ink-secret-worker", path = "../../../../crates/port/secret/worker" }
mail = { package = "uses-ink-mail", path = "../../../../crates/port/mail" }
mail-cf = { package = "uses-ink-mail-cf", path = "../../../../crates/port/mail/cf" }
mail-conformance = { package = "uses-ink-mail-conformance", path = "../../../../crates/port/mail/conformance" }
edge-api = { package = "uses-ink-edge-api", path = "../../../../crates/server/edge/api" }
edge-worker = { package = "uses-ink-edge-worker", path = "../../../../crates/server/edge/worker" }
sig = { package = "uses-ink-sig", path = "../../../../crates/core/sig" }
watch-worker = { package = "uses-ink-watch-worker", path = "../../../../crates/server/watch/worker" }
secret = { package = "uses-ink-secret", path = "../../../../crates/port/secret" }
wasm-bindgen = "=0.2.130"
