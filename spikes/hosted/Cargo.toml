# H0b spikes of M4 (docs/hosted.md section 5.0): Worker crates built for wasm32-unknown-unknown and
# run in workerd by `cargo xtask worker <case>`. Excluded from the root workspace (`exclude =
# ["spikes"]`); its own lockfile, its own `target/`.
[workspace]
resolver = "3"
members = ["workers/api", "workers/store", "workers/rig"]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"

# What a deployed Worker would be built with: small, one codegen unit, whole-program optimisation.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

# webauthn-rs-core reads the clock with `SystemTime::now()`, which panics on wasm32-unknown-unknown:
# a registration traps in workerd. This copy of 0.6.2 differs in one place (see `Clock` in
# `src/interface.rs`); decision 0096 records it.
[patch.crates-io]
webauthn-rs-core = { path = "vendor/webauthn-rs-core" }
