[package]
name = "uses-ink-spike-theme"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

# Its own workspace: the spike stays out of the root one and keeps `target/` here.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
unspliced = "0.1.1"
wit-bindgen = { version = "0.63.0", default-features = false, features = ["macros", "realloc"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
