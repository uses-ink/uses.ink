# The only files that may hold unsafe code: the pen's wasm exports, whose names need the unsafe
# `no_mangle` attribute (0034), and the plugin boundary's (0035): loading a `.cwasm` from the cache,
# and each guest's exports by symbol. The workspace denies the lint rather than forbidding it so
# these can allow it.
[unsafe]
allowed = [
    "crates/runtime/host/wasmtime/hostile/src/bind.rs",
    "crates/runtime/host/wasmtime/src/cache.rs",
    "crates/runtime/plugin/format/markdown/guest/src/bind.rs",
    "crates/runtime/plugin/format/obsidian/guest/src/bind.rs",
    "crates/runtime/plugin/source/git/guest/src/bind.rs",
    "crates/runtime/plugin/theme/quiet/guest/src/bind.rs",
    "crates/standalone/freehand-web/src/lib.rs",
]

# Free functions allowed outside a crate's entry points, by file and name, each with the reason no
# type can hold it. Kept tiny: a new row needs a reason a type cannot answer.
[free]
allowed = []

# `own` is the file of the SQL rule whose list of keywords is the one place they are written;
# `foreign` the folders whose `.sql` files are not ours.
[sql]
own = ["tools/xtask/src/layout/rules/sql.rs"]
foreign = ["spikes", "target"]

# The files outside the crates that the release rule reads and checks against each other.
[release]
config = "dist-workspace.toml"
dockerfile = "Dockerfile"
ignore = ".dockerignore"
pending = []
root = ["Cargo.lock", "Cargo.toml", "rust-toolchain.toml"]
toolchain = "rust-toolchain.toml"
workflow = ".github/workflows/release.yml"
workflows = ".github/workflows"

# The layers a crate path sits under, as `crates/<layer>/<family>`, first to last. A crate in a
# layer depends only on layers before it, and on an `open` layer; an `open` layer is for crates
# that stand alone: any crate may depend on them, and they depend on nothing outside their layer.
[layers]
order = ["core", "port", "server", "runtime", "surface", "standalone"]
open = ["standalone"]

# At most `limit` entries in a directory. `mode` is `report` (a note) or `enforce` (a failure); it is
# `enforce`, so a directory that grows past the limit fails the layout step until it is split or
# waived here. Directories with a part named in `exempt` are not checked; a waiver names a path (the
# root is the empty path) and why it may hold more. `fixture`, `support` and `tests` hold data and
# cases, one per file.
[fanout]
limit = 8
mode = "enforce"
exempt = ["fixture", "support", "tests"]

