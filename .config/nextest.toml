[profile.default]
# A test over 100 ms is a bug (docs/conventions.md, Tests).
slow-timeout = { period = "100ms", terminate-after = 1 }

# Compiling a tree-sitter grammar's queries takes 40 to 90 ms, once per process: the tests that
# highlight code (every test of host-native's `highlight`, and those with `highlight` in their
# name) have this budget instead.
[[profile.default.overrides]]
filter = "binary(highlight) | test(/highlight/)"
slow-timeout = { period = "250ms", terminate-after = 1 }

# Encoding AVIF runs rav1e, whose fixed cost per copy is tens of milliseconds even on the tiny
# generated fixtures: the tests that encode images (host-image's, and those with `image` at the
# end of their name) have this budget instead.
[[profile.default.overrides]]
filter = "package(uses-ink-host-image) | test(/_image$/)"
slow-timeout = { period = "1s", terminate-after = 1 }

# The git tests write a repository object by object and walk its history on up to four threads:
# about 30 ms alone, but past 100 ms beside the rest of the suite. Every test of the `git`
# binaries (host-native's and the CLI's) has this budget instead.
[[profile.default.overrides]]
filter = "binary(git)"
slow-timeout = { period = "250ms", terminate-after = 1 }

# At most one of the farm's process-heavy tests run at once, so they do not starve the 100 ms
# tests of the other crates.
[test-groups.farm]
max-threads = 1

# The farm's tests run its programs on this machine with the real `sh`, `flock`, `timeout` and
# `tail`: one test starts about forty processes and takes 90 ms alone and over 100 ms beside the
# rest of the suite. Those tests (every one in the binary's own `tests` module) have this budget
# instead, and the test of the hard limit more, because `--limit` is whole seconds and `timeout`
# cannot stop a job sooner than one. The rest of the farm's tests keep 100 ms.
[[profile.default.overrides]]
filter = "package(farm) & test(the_limit_stops_a_job_and_says_so)"
test-group = "farm"
slow-timeout = { period = "2s", terminate-after = 1 }

[[profile.default.overrides]]
filter = "package(farm) & test(/^tests::/)"
test-group = "farm"
slow-timeout = { period = "1s", terminate-after = 1 }

# Fetching starts the machine's `git upload-pack` for every clone and polls the clone's folder
# while it fills: tens of milliseconds a fetch, and a test fetches up to three times. The binaries
# that fetch (host-native's `fetch`, and the `source` ones that read through it) have this
# budget instead.
[[profile.default.overrides]]
filter = "binary(fetch) | binary(source)"
slow-timeout = { period = "2s", terminate-after = 1 }

# The edge's socket tests run a server on a thread, with time budgets of tens of milliseconds
# on the wire (a client that never finishes its head, a response that stops flowing); the CLI's
# serve tests also build a site first.
[[profile.default.overrides]]
filter = "binary_id(uses-ink-edge-axum::serve) | binary_id(uses-ink-cli::serve)"
slow-timeout = { period = "3s", terminate-after = 1 }

# A component's tests pay a Cranelift compile on a cold cache (tens of milliseconds for the
# hostile component, about a second for the markdown format) and the spinning plugin's 50 ms
# deadline; the components themselves are built once per run by `cargo xtask component`.
[[profile.default.overrides]]
filter = "binary_id(uses-ink-host-wasmtime::component)"
slow-timeout = { period = "2s", terminate-after = 1 }

# CI: a shared runner is two to three times slower than a developer machine, so the budgets above
# would fail good code. `cargo xtask check` locally still enforces them; CI keeps a ceiling that
# catches a hang or a runaway test. The selected profile's overrides win over the default's.
[profile.ci]
inherits = "default"

# The self-host loop comes first, then what compiles components on a cold cache (a second or
# more each, tens on a busy host) and what waits on a TLS server that is made to stall: the first override that matches a test wins.
[[profile.ci.overrides]]
filter = "binary_id(uses-ink-cli::selfhost) | binary_id(uses-ink-cli::push) | binary_id(uses-ink-cli::keys) | binary_id(uses-ink-cli::signin) | binary_id(uses-ink-cli::dashboard) | binary_id(uses-ink-cli::passkey) | binary_id(uses-ink-cli::vault) | binary_id(uses-ink-cli::abuse) | binary_id(uses-ink-cli::domains) | binary_id(uses-ink-cli::previews) | binary_id(uses-ink-cli::orgs) | binary_id(uses-ink-cli::bundle) | binary_id(uses-ink-cli::git) | binary_id(uses-ink-host-wasmtime::component) | binary_id(uses-ink-host-native::https) | binary_id(uses-ink-watch-git::https) | binary_id(uses-ink-host-native::git) | binary_id(uses-ink-host-native::fetch)"
slow-timeout = { period = "60s", terminate-after = 2 }

[[profile.ci.overrides]]
filter = "all()"
slow-timeout = { period = "5s", terminate-after = 1 }

# The self-host loop runs the real `ink serve` and builds a git site through the source component
# (a Cranelift compile on a cold cache), then a second build and a rollback: it waits on the
# loops' events, so this is only the ceiling for a hang.
[[profile.default.overrides]]
filter = "binary_id(uses-ink-cli::selfhost)"
slow-timeout = { period = "30s", terminate-after = 2 }

# A machine's key from login to refusal starts `ink serve`, enrols a key, signs calls and waits out
# the boot barrier, so this is the ceiling for a hang.
[[profile.default.overrides]]
filter = "binary_id(uses-ink-cli::keys)"
slow-timeout = { period = "30s", terminate-after = 2 }

# The publish verbs start `ink serve`, sign in and push over real HTTP; each test waits on a
# build, so this is the ceiling for a hang.
[[profile.default.overrides]]
filter = "binary_id(uses-ink-cli::push)"
slow-timeout = { period = "30s", terminate-after = 2 }

# A stranger's first hour and the dashboard over it start `ink serve`, signs in by its links, enrols keys and pushes over
# real HTTP; the passkey ceremonies run against the same server; the vault builds a site with
# photos (AVIF) natively and through the components, three times. Each waits on the server or on
# a build, so this is the ceiling for a hang.
[[profile.default.overrides]]
filter = "binary_id(uses-ink-cli::signin) | binary_id(uses-ink-cli::dashboard) | binary_id(uses-ink-cli::passkey) | binary_id(uses-ink-cli::vault) | binary_id(uses-ink-cli::abuse) | binary_id(uses-ink-cli::domains) | binary_id(uses-ink-cli::previews) | binary_id(uses-ink-cli::orgs)"
slow-timeout = { period = "30s", terminate-after = 2 }

# The help and failure tests run the real `ink` once for every command or every way to fail, so
# a test is dozens of process starts: a few hundred milliseconds, and a second on a busy host.
[[profile.default.overrides]]
filter = "binary_id(uses-ink-cli::help) | binary_id(uses-ink-cli::failure)"
slow-timeout = { period = "5s", terminate-after = 1 }

# The incremental properties build a site cold and again after each of many edits: every test of
# the `incremental` binaries (the engine's and the CLI's) has this budget instead.
[[profile.default.overrides]]
filter = "binary(incremental)"
slow-timeout = { period = "5s", terminate-after = 1 }

# `ink select` lists every fixture site, which reads and parses each one: the tests of the `select`
# binary have a second instead of the default 100 ms.
[[profile.default.overrides]]
filter = "binary(select)"
slow-timeout = { period = "1s", terminate-after = 1 }
