[profile.default]
# A test over 100 ms is a bug (docs/conventions.md, Tests).
slow-timeout = { period = "100ms", terminate-after = 1 }

# HACK(performance pass): the blog fixture holds photos, so every CLI site test that builds it
# encodes AVIF. Until encodes are shared across builds, these tests have the image budget. It
# comes first because nextest applies the first override that matches.
[[profile.default.overrides]]
filter = "package(uses-ink-cli) & binary(site)"
slow-timeout = { period = "500ms", terminate-after = 1 }

# Compiling a tree-sitter grammar's queries takes 40 to 90 ms, once per process: the tests that
# highlight code (every test of host-native's `highlight`, and those with `highlight` in their
# name) have this budget instead.
[[profile.default.overrides]]
filter = "binary(highlight) | test(/highlight/)"
slow-timeout = { period = "250ms", terminate-after = 1 }

# Encoding AVIF runs rav1e, whose fixed cost per copy is tens of milliseconds even on the tiny
# generated fixtures: the tests that encode images (host-image's, and those with `image` at the
# end of their name) have this budget instead.
[[profile.default.overrides]]
filter = "package(uses-ink-host-image) | test(/_image$/)"
slow-timeout = { period = "500ms", terminate-after = 1 }

# The git tests write a repository object by object and walk its history on up to four threads:
# about 30 ms alone, but past 100 ms beside the rest of the suite. Every test of the `git`
# binaries (host-native's and the CLI's) has this budget instead.
[[profile.default.overrides]]
filter = "binary(git)"
slow-timeout = { period = "250ms", terminate-after = 1 }

# A component's tests pay a Cranelift compile on a cold cache (tens of milliseconds for the
# hostile component, about a second for the markdown format) and the spinning plugin's 50 ms
# deadline; the components themselves are built once per run by `cargo xtask component`.
[[profile.default.overrides]]
filter = "binary_id(uses-ink-host-wasmtime::component)"
slow-timeout = { period = "2s", terminate-after = 1 }
