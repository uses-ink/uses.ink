# The jobs `farm check` runs, one per stage of the gate (`cargo xtask check <stage>`), all placed
# at once. `golden` jobs need a host whose output matches the reference architecture (x86_64).
#
# `inputs` lists the files a job reads, as globs read in order (the last match wins, `!` takes
# files out). A pass of the job is reused only while those files, `Cargo.lock`,
# `rust-toolchain.toml` and `.config/**` are byte for byte the same. Without `inputs` the whole
# tree counts. Every job here is `cargo xtask check <stage>`, so a change to `xtask/**` (and to
# the crates xtask builds: `freehand`, `token`) or to the root `Cargo.toml` or `.cargo/**` is an
# input of every job; the globs below keep the Rust jobs on everything but prose.
[job.lint]
run = "cargo xtask check lint"
golden = false
# clippy, fmt, deny and the layout rules read every crate, and layout also reads docs and brand.
# Whole tree on purpose.

[job.test]
run = "cargo xtask check test"
golden = true
# nextest of the whole workspace. Tests read source, fixtures and `brand/`, never prose, except
# the farm's own test that `docs/workflow.md` names every verb and flag: that file stays an input.
inputs = ["**", "!docs/**", "!PRODUCT.md", "docs/workflow.md"]
# `farm check test --affected` (or `farm test`) runs nextest for the crates a change touches and
# their dependents instead of this stage; the full `farm check` stays the gate.
affected = true
# 100 ms budgets and the push test's 1 s signature window fail on a loaded host (docs/decisions/0080):
# the job waits for a host whose load average is at most this.
max_load = 6

[job.docs]
run = "cargo xtask check docs"
golden = false
# The markdown checks (links, decision citations, crate paths, front matter, the generated index)
# read `docs/**`, `README.md` and `PRODUCT.md`, and the citations and paths read every `.rs`,
# `.toml`, `.yml` and `.md` file; then `cargo test --workspace --doc`, the doc tests of every
# crate, plugins included. Whole tree on purpose, prose included.
inputs = ["**", "docs/**", "README.md", "PRODUCT.md"]

[job.wasm]
run = "cargo xtask check wasm"
golden = false
# `freehand` on wasi and `freehand-web` for the browser. They depend on `fixture` (dev) and, through
# `cargo xtask`, on `xtask` and `token`; the workspace manifest and `.cargo/**` (the wasi runner)
# configure the build. No other crate is compiled by this stage.
inputs = ["freehand/**", "freehand-web/**", "fixture/**", "token/**", "xtask/**", "/Cargo.toml", ".cargo/**"]

[job.sites]
run = "cargo xtask check sites"
golden = true
# builds `ink` and every site fixture natively and through the components: nearly every crate.
inputs = ["**", "!docs/**", "!PRODUCT.md"]

# `farm test` measures the change from `base` (default: where the workspace left `main`). A changed
# path inside a crate affects that crate and its dependents; `Cargo.toml`, `Cargo.lock`,
# `rust-toolchain.toml`, `deny.toml`, `.config/**` and `.cargo/**` affect all; so does a path in no
# crate unless `ignore` selects it. These are the paths in no crate that no test reads. Not
# `docs/workflow.md`: the farm's own test reads it, so a change to it affects all.
[affected]
ignore = ["docs/**", "!docs/workflow.md", "*.md", "LICENSE-*", "Dockerfile", "dist-workspace.toml", "rustfmt.toml", "clippy.toml"]

# Ignored files `farm workspace --forget` may delete with the workspace: build caches by name, at any depth.
[workspace]
disposable = [".ink"]

# Names the sync leaves out and the cache digest does not read, at any depth. `target` and the
# secret patterns (`.env`, `*.pem`, `*.key`) are built into farm.
[sync]
exclude = [".jj", ".git", ".impeccable"]

# How long and how many passes the machine keeps (defaults: 168 hours, 256 entries).
[cache]
max_age_hours = 168
max_entries = 256

# `farm check` warns after this many full checks that ran a stage in 24 hours in one workspace
# (default off). It never refuses.
[budget]
full_checks_per_day = 3
